# Stack-eigene JCasC für lokale Tests in beiden Repository-Modi.
# Die Testkonten entsprechen dem separaten Jenkins-Dev-Start; keine produktive Anmeldung.
jenkins:
  systemMessage: 'Datenportal lokale Testumgebung'
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: 'admin'
        - id: seed-user
          password: 'seed'
        - id: read-user
          password: 'read'
        - id: agi-user
          password: 'agi'
        - id: mfk-user
          password: 'mfk'
        - id: statistikdienst-user
          password: 'statistikdienst'
  authorizationStrategy:
    projectMatrix:
      entries:
        - user:
            name: admin
            permissions: ['Overall/Administer']
        - user:
            name: seed-user
            permissions: ['Overall/Read']
        - user:
            name: read-user
            permissions: ['Overall/Read']
        - user:
            name: agi-user
            permissions: ['Overall/Read']
        - user:
            name: mfk-user
            permissions: ['Overall/Read']
        - user:
            name: statistikdienst-user
            permissions: ['Overall/Read']
unclassified:
  location:
    url: '${JENKINS_URL}'
  lockableResourcesManager:
    declaredResources:
      - name: datenportal-topic-repository
  gretlDatenportalJobs:
    displayName: Datenportal Jobs
    urlName: gretl-datenportal
    topicRepositoryMode: '${THEMEN_REPO_MODE}'
    topicRepositoryUrl: '${THEMEN_REPO_URL}'
    topicRepositoryBranch: '${THEMEN_REPO_BRANCH}'
    topicRepositoryPath: '${THEMEN_REPO_PATH}'
    topicRepositoryWriteBackEnabled: false
    seedJobAutoCreate: true
    seedJobCron: 'H/15 * * * *'
    seedJobBuildsToKeep: 20
    seedJobOperatorsTeam: gretl-datenportal-seed-operators
tool:
  git:
    installations:
      - name: Default
        home: git
